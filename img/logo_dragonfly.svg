<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Logo DragonFly" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <g id="wing">
      <ellipse cx="-90" cy="0" rx="92" ry="25" fill="#22d3ee" fill-opacity="0.22" stroke="#67e8f9" stroke-width="3"/>
      <path d="M0 0 L-180 0 M-45 -2 L-62 -20 M-45 2 L-62 20 M-100 -1 L-116 -17 M-100 1 L-116 17" stroke="#67e8f9" stroke-opacity="0.7" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <circle cx="-168" cy="0" r="4" fill="#fde68a"/>
    </g>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#bg)"/>

  <!-- alas -->
  <use href="#wing" transform="translate(250 203) rotate(22)"/>
  <use href="#wing" transform="translate(262 203) scale(-1 1) rotate(22)"/>
  <use href="#wing" transform="translate(250 214) scale(0.92) rotate(-12)"/>
  <use href="#wing" transform="translate(262 214) scale(-0.92 0.92) rotate(-12)"/>

  <!-- abdomen -->
  <path d="M243 226 L269 226 L262 372 Q256 384 250 372 Z" fill="url(#body)"/>
  <path d="M244 256 H268 M246 284 H266 M248 312 H264 M250 340 H262" stroke="#0f172a" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>

  <!-- torax y cabeza -->
  <ellipse cx="256" cy="202" rx="18" ry="30" fill="url(#body)"/>
  <circle cx="256" cy="160" r="19" fill="#14b8a6"/>
  <circle cx="243" cy="156" r="10" fill="#fde68a"/>
  <circle cx="269" cy="156" r="10" fill="#fde68a"/>
  <circle cx="243" cy="156" r="4" fill="#0f172a"/>
  <circle cx="269" cy="156" r="4" fill="#0f172a"/>

  <!-- gota (diabetes) -->
  <path d="M256 186 C256 186 244 201 244 208 a12 12 0 0 0 24 0 C268 201 256 186 256 186 Z" fill="#ef4444" stroke="#fecaca" stroke-width="1.5"/>

  <!-- texto -->
  <text x="256" y="428" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">DragonFly</text>
  <text x="256" y="462" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#67e8f9" letter-spacing="1">Algoritmos Metaheurísticos</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
